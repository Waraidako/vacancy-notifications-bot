syntax = "proto3";

package vacancies;

option go_package = "vacancy_notifications_bot/proto;vacanciespb";

service Subscriptions {
  rpc PushVacancies(SendVacancies) returns (ConfirmPush);
}

message Vacancy {
  string id = 1;
  string title = 2;
  string experience = 3;
  string url = 4;
}

message SendVacancies {
  repeated Vacancy vacancies = 1;
}

message ConfirmPush {
  bool ack = 1;
}
